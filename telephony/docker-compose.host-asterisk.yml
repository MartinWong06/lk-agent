# OPTIONAL overlay for Linux hosts / LiveKit SIP NAT debugging.
#
# Docker Desktop for Windows/macOS does NOT provide real host networking to the
# Windows/macOS loopback. Using this overlay there often breaks INVITE (30s
# Terminated) and does NOT fix softphone ICE.
#
# For Windows softphone audio, stay on bridge compose and set:
#   SOFTPHONE_PUBLIC_HOST=<your LAN IP>   e.g. 192.168.1.42
# then open http://192.168.1.42:8088/ (not localhost).
#
# Linux usage:
#   docker compose -f docker-compose.yml -f docker-compose.host-asterisk.yml \
#     up -d --build --force-recreate --scale agent=1
services:
  kamailio:
    ports: !override
      - "8080:8080"
    environment:
      ASTERISK_HOST: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"

  asterisk:
    network_mode: host
    networks: !reset []
    ports: !reset []
    environment:
      SOFTPHONE_MEDIA_IP: ${SOFTPHONE_MEDIA_IP:-127.0.0.1}
