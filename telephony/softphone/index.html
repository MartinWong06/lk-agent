<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Enterprise Voice Softphone</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- Vendored from https://github.com/onsip/SIP.js/releases/download/0.21.2/sip-0.21.2.min.js
       (npm/jsDelivr path dist/sip.min.js 404s — package ships ESM lib/ only) -->
  <script src="vendor/sip-0.21.2.min.js"></script>
</head>
<body>
  <main class="app">
    <header>
      <p class="brand">Enterprise Voice</p>
      <h1>Web softphone</h1>
      <p class="sub">Kamailio edge → Asterisk → LiveKit duplex agent</p>
    </header>

    <section class="panel">
      <p id="status" class="status">Loading config…</p>
      <form id="login" class="row" autocomplete="on" hidden>
        <label for="sip-user">User</label>
        <input id="sip-user" name="username" type="text" autocomplete="username" />
        <label for="sip-password">Password</label>
        <input id="sip-password" name="password" type="password" autocomplete="current-password" />
      </form>
      <div class="row">
        <button id="btn-register" type="button">Register</button>
        <button id="btn-unregister" type="button" disabled>Unregister</button>
      </div>
      <div class="row">
        <label for="dest">Dial</label>
        <input id="dest" type="text" value="1000" />
        <button id="btn-call" type="button" disabled>Call AI</button>
        <button id="btn-hangup" type="button" disabled>Hang up</button>
      </div>
      <audio id="remote-audio" autoplay playsinline></audio>
    </section>

    <section class="panel log-panel">
      <h2>Log</h2>
      <pre id="log"></pre>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
