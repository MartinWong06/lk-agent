[general]
; Narrower range = more reliable Docker Desktop UDP publish than 100 ports
rtpstart=10000
rtpend=10050
icesupport=yes
; Strict RTP drops packets during ICE renegotiation / Docker NAT quirks
strictrtp=no
; Do NOT set stunaddr here for Docker Desktop softphone demos.
; Google STUN times out / injects WAN srflx candidates that break LAN ICE
; when EXTERNAL_SIP_IP is already on the LiveKit TCP transport.
; Softphone WebRTC relies on endpoint media_address=SOFTPHONE_MEDIA_IP (LAN).
