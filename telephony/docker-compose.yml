# HA-oriented reference stack:
# Web softphone → Kamailio (edge) → Asterisk → LiveKit SIP → duplex agents
#
# Usage:
#   cp .env.example .env   # fill LIVEKIT_* and passwords
#   docker compose up -d --build --force-recreate --scale agent=1
#   open http://localhost:8088/

name: enterprise-voice

services:
  rtpengine:
    image: drachtio/rtpengine:latest
    network_mode: host
    # host networking simplifies ICE/RTP for local demos; use bridge + port maps in prod
    restart: unless-stopped
    profiles: ["full-media"]

  kamailio:
    build:
      context: ./kamailio
    restart: unless-stopped
    # Strip CR then run host-mounted entrypoint (works with stale images + Windows CRLF)
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "tr -d '\\r' < /entrypoint.sh > /tmp/ep.sh && exec /bin/sh /tmp/ep.sh",
      ]
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "8080:8080"   # SIP over WebSocket (ws://host:8080)
    environment:
      SIP_DOMAIN: ${SIP_DOMAIN:-voice.local}
      ASTERISK_HOST: asterisk
      SOFTPHONE_USER: ${SOFTPHONE_USER:-1001}
      SOFTPHONE_PASSWORD: ${SOFTPHONE_PASSWORD:-change-me-softphone}
    volumes:
      - ./kamailio/entrypoint.sh:/entrypoint.sh:ro
      - ./kamailio/kamailio.cfg:/etc/kamailio/kamailio.cfg:ro
      - ./kamailio/dispatcher.list:/etc/kamailio/dispatcher.list.template:ro
    depends_on:
      asterisk:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x kamailio >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      - voice

  asterisk:
    build:
      context: ./asterisk
    restart: unless-stopped
    environment:
      SIP_DOMAIN: ${SIP_DOMAIN:-voice.local}
      SOFTPHONE_USER: ${SOFTPHONE_USER:-1001}
      SOFTPHONE_PASSWORD: ${SOFTPHONE_PASSWORD:-change-me-softphone}
      AI_EXTENSION: ${AI_EXTENSION:-1000}
      LIVEKIT_SIP_HOST: ${LIVEKIT_SIP_HOST}
      LIVEKIT_SIP_USERNAME: ${LIVEKIT_SIP_USERNAME:-asterisk-trunk}
      LIVEKIT_SIP_PASSWORD: ${LIVEKIT_SIP_PASSWORD:-change-me-trunk-password}
      LIVEKIT_DID: ${LIVEKIT_DID:-+15555550100}
      EXTERNAL_SIP_IP: ${EXTERNAL_SIP_IP}
    volumes:
      - ./asterisk/conf:/config:ro
      - ./asterisk/entrypoint.sh:/entrypoint.sh:ro
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "tr -d '\\r' < /entrypoint.sh > /tmp/ep.sh && exec /bin/sh /tmp/ep.sh",
      ]
    healthcheck:
      test: ["CMD-SHELL", "asterisk -rx 'core show version' >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - voice
    # RTP media range for Asterisk ↔ LiveKit
    ports:
      - "10000-10100:10000-10100/udp"

  softphone:
    build:
      context: ./softphone
    restart: unless-stopped
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "tr -d '\\r' < /docker-entrypoint.sh > /tmp/ep.sh && exec /bin/sh /tmp/ep.sh",
      ]
    ports:
      - "8088:80"
    environment:
      SIP_DOMAIN: ${SIP_DOMAIN:-voice.local}
      SOFTPHONE_USER: ${SOFTPHONE_USER:-1001}
      SOFTPHONE_PASSWORD: ${SOFTPHONE_PASSWORD:-change-me-softphone}
      AI_EXTENSION: ${AI_EXTENSION:-1000}
      # Browser reaches Kamailio on the host-mapped port
      SOFTPHONE_WS_SERVER: ${SOFTPHONE_WS_SERVER:-ws://localhost:8080}
    volumes:
      - ./softphone/docker-entrypoint.sh:/docker-entrypoint.sh:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - voice

  agent:
    build:
      context: ../livekit-voice-agent
    restart: unless-stopped
    # Host networking avoids Docker bridge WSS timeouts to LiveKit Cloud in many setups
    # Do NOT --scale agent>1 on a single Docker Desktop host (port / process flapping).
    network_mode: host
    env_file:
      - .env
    environment:
      AGENT_CONFIG: /config/agent.yaml
      AGENT_NAME: ${AGENT_NAME:-enterprise-voice}
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
    volumes:
      - ./config/agent.yaml:/config/agent.yaml:ro
    command: ["uv", "run", "agent.py", "start"]
    # HA: run extra workers on other hosts (or drop network_mode:host) — not --scale on one Desktop VM.

networks:
  voice:
    driver: bridge
