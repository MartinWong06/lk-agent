#!KAMAILIO
#
# Edge SIP proxy: WebSocket softphone + UDP/TCP → Asterisk (dispatcher)
#
# Security model:
#   - REGISTER and every initial INVITE must pass SIP digest auth against the
#     users htable (rendered from SIP_USERS / SOFTPHONE_USER at container start).
#   - Only INVITE is accepted as an initial non-REGISTER request, and only for
#     our own domain (no open relay).
#   - In-dialog requests from clients may only be routed to Asterisk.
#   - Requests from the Asterisk dispatcher set are trusted.
#   - Flooding sources (pike) and repeated auth failures are banned / disconnected.
#
# __SIP_DOMAIN__ and __AUTH_SECRET__ are substituted by entrypoint.sh.

####### Global #######
debug=2
log_stderror=yes
memdbg=5
memlog=5
log_facility=LOG_LOCAL0
children=4
tcp_accept_no_cl=yes
server_signature=no
user_agent_header="User-Agent: edge"
server_header="Server: edge"

alias="__SIP_DOMAIN__"

####### Listen #######
listen=udp:0.0.0.0:5060
listen=tcp:0.0.0.0:5060
listen=tcp:0.0.0.0:8080

####### Modules #######
loadmodule "jsonrpcs.so"
loadmodule "kex.so"
loadmodule "corex.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "ctl.so"
loadmodule "cfg_rpc.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "nathelper.so"
loadmodule "dispatcher.so"
loadmodule "xhttp.so"
loadmodule "websocket.so"
loadmodule "auth.so"
loadmodule "uac.so"
loadmodule "htable.so"
loadmodule "pike.so"

####### Module params #######
modparam("tm", "failure_reply_mode", 3)
modparam("tm", "fr_timer", 30000)
modparam("tm", "fr_inv_timer", 120000)

modparam("rr", "enable_full_lr", 1)
modparam("rr", "append_fromtag", 1)

modparam("registrar", "method_filtering", 1)
modparam("registrar", "max_expires", 3600)
modparam("registrar", "default_expires", 600)
modparam("registrar", "received_avp", "$avp(RECEIVED)")
modparam("registrar", "max_contacts", 5)

modparam("usrloc", "db_mode", 0)
modparam("usrloc", "timer_interval", 60)
# NAT flag required when nathelper ping_nated_only is enabled
modparam("usrloc", "nat_bflag", 6)

#!define FLT_NATS 6

modparam("nathelper", "natping_interval", 30)
modparam("nathelper", "ping_nated_only", 1)
modparam("nathelper", "sipping_from", "sip:pinger@__SIP_DOMAIN__")
modparam("nathelper", "received_avp", "$avp(RECEIVED)")

modparam("dispatcher", "list_file", "/tmp/dispatcher.list")
modparam("dispatcher", "flags", 2)
modparam("dispatcher", "xavp_dst", "_dsdst_")

modparam("websocket", "keepalive_mechanism", 1)
modparam("websocket", "keepalive_timeout", 30)

modparam("auth", "secret", "__AUTH_SECRET__")
modparam("auth", "nonce_expire", 300)

# users: SIP username → password. ipban/authfail expire on their own.
modparam("htable", "htable", "users=>size=6;")
modparam("htable", "htable", "ipban=>size=8;autoexpire=600;")
modparam("htable", "htable", "authfail=>size=8;autoexpire=600;")

modparam("pike", "sampling_time_unit", 2)
modparam("pike", "reqs_density_per_unit", 30)
modparam("pike", "remove_latency", 4)

####### Routing #######
request_route {
    route(REQINIT);

    if (nat_uac_test(64)) {
        # WebSocket clients always need NAT helpers
        force_rport();
        if (is_method("REGISTER")) {
            fix_nated_register();
        } else {
            if (!add_contact_alias()) {
                xlog("L_ERR", "alias contact failed\n");
                sl_send_reply("400", "Bad Request");
                exit;
            }
        }
    }

    if (has_totag()) {
        route(WITHINDLG);
    }

    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            route(RELAY);
        }
        exit;
    }

    t_check_trans();

    if (is_method("ACK")) {
        exit;
    }

    if (is_method("REGISTER")) {
        route(REGISTRAR);
        exit;
    }

    if (!is_method("INVITE")) {
        sl_send_reply("405", "Method Not Allowed");
        exit;
    }

    if ($rU == $null) {
        sl_send_reply("484", "Address Incomplete");
        exit;
    }

    route(AUTH);

    if (uri != myself) {
        sl_send_reply("403", "Relay Forbidden");
        exit;
    }

    # Stay in the dialog path: WebSocket clients can only reach Asterisk through
    # this proxy, so ACK/BYE must be routable back here (otherwise Asterisk never
    # sees the ACK for 200 OK and tears the call down after ~32s).
    record_route();

    route(DISPATCH);
}

route[REQINIT] {
    if (!ds_is_from_list()) {
        if ($sht(ipban=>$si) != $null) {
            exit;
        }
        # Browsers arrive via the nginx WSS proxy (one source IP); nginx rate-limits
        # those per client, so pike only guards direct UDP/TCP SIP.
        if ($proto != "ws" && $proto != "wss" && !pike_check_req()) {
            xlog("L_ALERT", "pike: banning $si after flood ($rm $fu)\n");
            $sht(ipban=>$si) = 1;
            exit;
        }
    }
    if ($ua =~ "friendly-scanner|sipcli|sipvicious|sip-scan|VaxSIPUserAgent|pplsip|sundayddr|iWar|SIPBomber") {
        xlog("L_WARN", "dropping scanner UA '$ua' from $si\n");
        exit;
    }
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }
    if (!sanity_check("17895", "7")) {
        xlog("L_WARN", "malformed SIP from $si:$sp\n");
        exit;
    }
}

route[WITHINDLG] {
    if (has_totag()) {
        if (loose_route()) {
            if ($du == "" && $ru =~ ";alias=") {
                if (!handle_ruri_alias()) {
                    sl_send_reply("400", "Bad Request");
                    exit;
                }
            }
            # Clients may only send in-dialog requests towards Asterisk.
            if (!ds_is_from_list() && !ds_is_from_list("1", "3", "$ru")) {
                xlog("L_WARN", "in-dialog $rm from $si to non-Asterisk $ru refused\n");
                sl_send_reply("403", "Forbidden");
                exit;
            }
            route(RELAY);
            exit;
        }
        if (is_method("ACK")) {
            if (t_check_trans()) {
                route(RELAY);
                exit;
            }
            exit;
        }
        sl_send_reply("404", "Not Found");
        exit;
    }
}

# Initial INVITEs: proxy digest auth; the auth user must be the From user.
route[AUTH] {
    if (ds_is_from_list()) {
        return;
    }
    if ($sht(users=>$fU) == $null) {
        xlog("L_WARN", "INVITE from unknown user $fU ($si)\n");
        sl_send_reply("403", "Forbidden");
        exit;
    }
    pv_proxy_authenticate("__SIP_DOMAIN__", "$sht(users=>$fU)", "0");
    $var(rc) = $rc;
    if ($var(rc) < 0) {
        if ($var(rc) == -2) {
            route(AUTHFAIL);
        }
        proxy_challenge("__SIP_DOMAIN__", "0");
        exit;
    }
    if ($au != $fU) {
        sl_send_reply("403", "Auth ID Mismatch");
        exit;
    }
    consume_credentials();
}

route[REGISTRAR] {
    if ($sht(users=>$tU) == $null || $fU != $tU) {
        xlog("L_WARN", "REGISTER for unknown/mismatched user $tU ($si)\n");
        sl_send_reply("403", "Forbidden");
        exit;
    }
    pv_www_authenticate("__SIP_DOMAIN__", "$sht(users=>$tU)", "0");
    $var(rc) = $rc;
    if ($var(rc) < 0) {
        if ($var(rc) == -2) {
            route(AUTHFAIL);
        }
        www_challenge("__SIP_DOMAIN__", "0");
        exit;
    }
    if ($au != $tU) {
        sl_send_reply("403", "Auth ID Mismatch");
        exit;
    }
    consume_credentials();
    if (!save("location")) {
        sl_reply_error();
    }
    exit;
}

# Wrong password: count per WS connection (all browsers share the nginx IP) or per
# source IP for direct SIP; drop the connection / ban the IP after 5 failures.
route[AUTHFAIL] {
    if ($proto == "ws" || $proto == "wss") {
        $var(key) = "c" + $conid;
    } else {
        $var(key) = "i" + $si;
    }
    # $shtinc does not create missing items
    if ($sht(authfail=>$var(key)) == $null) {
        $sht(authfail=>$var(key)) = 1;
        $var(n) = 1;
    } else {
        $var(n) = $shtinc(authfail=>$var(key));
    }
    xlog("L_WARN", "auth failure #$var(n) user=$fU src=$si proto=$proto\n");
    if ($var(n) >= 5) {
        if ($proto == "ws" || $proto == "wss") {
            ws_close(1008, "Too many auth failures");
        } else {
            $sht(ipban=>$si) = 1;
        }
        exit;
    }
}

route[DISPATCH] {
    if (!ds_select_dst("1", "4")) {
        sl_send_reply("503", "No destination");
        exit;
    }
    xlog("L_INFO", "dispatch $ru -> $du\n");
    route(RELAY);
    exit;
}

route[RELAY] {
    if (is_method("INVITE|BYE|SUBSCRIBE|UPDATE")) {
        if (!t_is_set("branch_route")) {
            t_on_branch("MANAGE_BRANCH");
        }
    }
    if (is_method("INVITE|SUBSCRIBE|UPDATE")) {
        if (!t_is_set("onreply_route")) {
            t_on_reply("MANAGE_REPLY");
        }
    }
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

branch_route[MANAGE_BRANCH] {
    xdbg("new branch $ru\n");
}

onreply_route[MANAGE_REPLY] {
    if (nat_uac_test(64)) {
        add_contact_alias();
    }
}

event_route[xhttp:request] {
    set_reply_close();
    set_reply_no_connect();

    if ($Rp != 8080) {
        xhttp_reply("403", "Forbidden", "", "");
        exit;
    }

    if ($hdr(Upgrade) =~ "websocket"
            && $hdr(Connection) =~ "Upgrade"
            && $rm =~ "GET") {
        if (ws_handle_handshake()) {
            exit;
        }
        xhttp_reply("404", "Not Found", "", "");
        exit;
    }

    xhttp_reply("200", "OK", "text/plain", "edge\n");
}

event_route[websocket:closed] {
    xlog("L_INFO", "websocket closed\n");
}

#!include_file "/tmp/kamailio-users.cfg"
